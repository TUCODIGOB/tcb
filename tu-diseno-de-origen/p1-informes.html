<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Informes del P1</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/webp" href="/images/favicon-origen-natal-oscuro.webp" />

<style>
@font-face{
  font-display:swap; font-family:'Open Sans'; font-style:normal; font-weight:400;
  src:url('/fonts-web/open-sans-v44-latin_latin-ext-regular.woff2') format('woff2');
}
@font-face{
  font-display:swap; font-family:'Open Sans'; font-style:normal; font-weight:600;
  src:url('/fonts-web/open-sans-v44-latin_latin-ext-600.woff2') format('woff2');
}

:root{
  --crema:#FDF9EF; --papel:#FFFFFF; --tinta:#0E3F4B; --texto:#3A3A3A;
  --suave:#6E7B7F; --oro:#CFB180; --borde:#E3DDD2; --rojo:#B3261E;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--crema); color:var(--texto);
  font-family:'Open Sans',system-ui,sans-serif; font-size:16px; line-height:1.55;
  padding:32px 16px 64px;
}
.hoja{max-width:900px;margin:0 auto;}
h1{font-size:1.2rem;color:var(--tinta);margin:0 0 4px;letter-spacing:.02em;}
.entradilla{margin:0 0 24px;color:var(--suave);font-size:.9rem;}

.mando{
  background:var(--papel); border:1px solid var(--borde); border-radius:10px;
  padding:16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;
}
label{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta);}
input,select{
  font-family:inherit; font-size:.95rem; color:var(--texto);
  background:var(--crema); border:1px solid var(--borde); border-radius:8px;
  padding:10px 12px; min-width:0;
}
select{flex:1 1 320px;}
input{flex:1 1 200px;}
button{
  background:var(--tinta); color:var(--crema); font-family:inherit; font-size:.9rem;
  font-weight:600; border:none; border-radius:8px; padding:11px 22px; cursor:pointer;
}
button:disabled{background:var(--suave);cursor:not-allowed;}

.aviso{margin-top:14px;font-size:.9rem;color:var(--rojo);}
.aviso:empty{display:none;}

.ficha{
  margin-top:20px; background:var(--papel); border:1px solid var(--borde);
  border-radius:10px; padding:18px 20px;
}
.ficha:empty{display:none;}
.ficha h2{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--suave);margin:0 0 12px;font-weight:600;}
.resumen{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.86rem;color:var(--suave);margin:0 0 16px;}
.resumen b{color:var(--tinta);}

details{background:var(--crema);border:1px solid var(--borde);border-radius:8px;margin-bottom:8px;}
summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:.9rem;color:var(--tinta);}
summary::-webkit-details-marker{display:none;}
.dentro{padding:0 14px 14px;font-size:.86rem;}
table{width:100%;border-collapse:collapse;font-size:.82rem;}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--borde);vertical-align:top;}
th{color:var(--suave);font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;}
td.num,th.num{text-align:right;white-space:nowrap;}
.linea{margin:.6rem 0;}
</style>
</head>
<body>

<div class="hoja">
  <h1>Informes del P1</h1>
  <p class="entradilla">Cómo ha ido cada informe generado. Solo para revisar; no toca nada.</p>

  <div class="mando">
    <label for="clave">Llave</label>
    <input id="clave" type="password" placeholder="la llave" autocomplete="off" />
    <button type="button" id="entrar">Entrar</button>
  </div>

  <div class="mando" id="mandoInforme" style="margin-top:10px;display:none">
    <label for="lista">Informe</label>
    <select id="lista"></select>
    <button type="button" id="ver">Ver</button>
  </div>

  <p class="aviso" id="aviso"></p>
  <div class="ficha" id="ficha"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let _clave = '';

function decir(txt){ $('aviso').textContent = txt || ''; }

async function pedir(params){
  const url = '/api/p1-informes' + (params ? '?' + params : '');
  const resp = await fetch(url, { headers: { 'x-p1-clave': _clave } });
  if (resp.status === 401) throw new Error('La llave no vale.');
  const datos = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(datos.error || 'No se ha podido leer.');
  return datos;
}

$('entrar').addEventListener('click', async () => {
  _clave = $('clave').value.trim();
  if (!_clave) return decir('Escribe la llave.');
  decir('');
  $('entrar').disabled = true;
  try {
    const { informes } = await pedir('');
    const lista = $('lista');
    lista.innerHTML = informes.length
      ? informes.map(i => {
          // La fecha y la hora, y de quien es. Si de alguno no se sabe, se
          // enseña su numero de compra, que es lo que habia antes.
          const cuando = String(i.guardado).replace('T', ' ').slice(0, 16);
          const quien = [i.nombre, i.email].filter(Boolean).join(' — ') || i.compra;
          return '<option value="' + esc(i.compra) + '">' + esc(cuando) + ' — ' + esc(quien) + '</option>';
        }).join('')
      : '<option value="">(todavia no hay informes guardados)</option>';
    $('mandoInforme').style.display = '';
  } catch (err) {
    decir(err.message);
  }
  $('entrar').disabled = false;
});

$('ver').addEventListener('click', async () => {
  const compra = $('lista').value;
  if (!compra) return decir('No hay ningun informe que ver.');
  decir('');
  $('ver').disabled = true;
  $('ficha').innerHTML = '';
  try {
    pintar(await pedir('compra=' + encodeURIComponent(compra)));
  } catch (err) {
    decir(err.message);
  }
  $('ver').disabled = false;
});

// ═══════════════════════════════════════════════════════════════
// EL CUADERNO. Lo mismo que se pintaba al terminar de generar, mas lo que ha
// costado cada llamada y el intento en el que salio.
// ═══════════════════════════════════════════════════════════════
function pintar(informe){
  const c = informe.cuaderno;
  if (!c) {
    $('ficha').innerHTML = '<h2>Sin cuaderno</h2><p class="linea">Este informe se guardó antes de que se empezara a apuntar cómo iba. Solo está el texto.</p>';
    return;
  }

  const cl = informe.cliente || {};
  const entraron = Array.isArray(c.entraron) ? c.entraron : [];

  // ── Los tiempos ──
  const tiempos = Array.isArray(c.tiempos) ? c.tiempos : [];
  const total = tiempos.reduce((a,t) => a + (Number(t.segundos) || 0), 0);
  const filasT = tiempos.map(t =>
    '<tr><td>' + esc(t.que) + '</td><td class="num">' + esc(t.segundos) + ' s</td></tr>').join('');

  // ── El gasto ──
  const gastos = Array.isArray(c.gastos) ? c.gastos : [];
  const gastoTotal = gastos.reduce((a,g) => a + (Number(g.dolares) || 0), 0);
  const filasG = gastos.map(g =>
    '<tr><td>' + esc(g.que) + '</td><td>' + esc(g.modelo) + '</td><td class="num">' + esc(g.entrada) +
    '</td><td class="num">' + esc(g.salida) + '</td><td class="num">' +
    (Number(g.dolares) || 0).toFixed(4) + ' $</td></tr>').join('');

  // ── Lo que sacó el paso 1, por área y por lista ──
  const areas = [];
  for (const r of entraron) if (!areas.includes(r.area)) areas.push(r.area);
  const cuenta = (area, lista) => entraron.filter(r => r.area === area && r.lista === lista).length;
  const filasA = areas.map(a =>
    '<tr><td>' + esc(a) + '</td><td class="num">' + cuenta(a,'fortalezas') +
    '</td><td class="num">' + cuenta(a,'desafios') + '</td></tr>').join('');

  // ── La limpieza ──
  const fuera1 = Array.isArray(c.quitaLimpieza) ? c.quitaLimpieza : [];
  const fuera2 = Array.isArray(c.quitaRepaso) ? c.quitaRepaso : [];
  const vuelven = Array.isArray(c.devueltos) ? c.devueltos : [];
  const porNumero = new Map(entraron.map(r => [r.n, r]));
  const comoLinea = n => {
    const r = porNumero.get(n);
    if (!r) return '#' + esc(n);
    return '#' + esc(r.n) + ' ' + esc(r.lista === 'fortalezas' ? 'FORTALEZA' : 'DESAFÍO') +
           ' ' + esc(r.area) + ' — ' + esc(r.conducta) + ' — ' + esc(r.origen);
  };
  const linea = (titulo, lista) => lista.length
    ? '<p class="linea"><b>' + titulo + ' ' + lista.length + ':</b><br>' + lista.map(comoLinea).join('<br>') + '</p>'
    : '<p class="linea"><b>' + titulo + ' ninguno.</b></p>';

  // ── Los que se quedan, ya escritos ──
  const quedan = Array.isArray(c.escritos) ? c.escritos : [];
  const filasQ = quedan.map((r,i) =>
    '<tr><td>' + (i+1) + '</td><td>' + esc(r.lista === 'fortalezas' ? 'FORTALEZA' : 'DESAFÍO') +
    '</td><td>' + esc(r.area) + '</td><td>' + esc(r.conducta) + '</td><td>' + esc(r.titulo) +
    '</td><td>' + esc(r.descripcion) + '</td></tr>').join('');

  const intento = informe.intento
    ? (Number(informe.intento) === 1 ? 'a la primera' : 'en el intento ' + esc(informe.intento))
    : 'sin apuntar';

  $('ficha').innerHTML =
    '<h2>' + esc(cl.nombre || cl.email || '(sin nombre)') + ' — ' + esc(informe.compra || '') + '</h2>' +

    '<p class="resumen">' +
      '<span>Salió: <b>' + intento + '</b></span>' +
      '<span>Total: <b>' + total.toFixed(1) + ' s</b></span>' +
      '<span>Coste: <b>' + gastoTotal.toFixed(4) + ' $</b></span>' +
      '<span>Áreas escritas: <b>' + (Array.isArray(informe.areas) ? informe.areas.length : 0) + '</b></span>' +
      '<span>Rasgos que entraron: <b>' + entraron.length + '</b></span>' +
      '<span>Se quedaron: <b>' + quedan.length + '</b></span>' +
      '<span>Guardado: <b>' + esc(String(informe.generado || '').replace('T',' ').slice(0,16)) + '</b></span>' +
    '</p>' +

    '<details open><summary>Lo que ha tardado cada llamada</summary><div class="dentro">' +
    '<table>' + filasT +
    '<tr><td><b>TOTAL</b></td><td class="num"><b>' + total.toFixed(1) + ' s</b></td></tr></table>' +
    '</div></details>' +

    '<details><summary>Lo que ha costado cada llamada</summary><div class="dentro">' +
    (gastos.length
      ? '<table><tr><th>Llamada</th><th>Modelo</th><th class="num">Entrada</th><th class="num">Salida</th><th class="num">Coste</th></tr>' +
        filasG + '<tr><td colspan="4"><b>TOTAL</b></td><td class="num"><b>' + gastoTotal.toFixed(4) + ' $</b></td></tr></table>'
      : '<p class="linea">Este informe se generó antes de que se midiera el gasto.</p>') +
    '</div></details>' +

    '<details><summary>Lo que sacó el paso 1, por área</summary><div class="dentro">' +
    '<table><tr><th>Área</th><th class="num">Fortalezas</th><th class="num">Desafíos</th></tr>' +
    filasA + '</table></div></details>' +

    '<details><summary>La limpieza</summary><div class="dentro">' +
    linea('Quitó la limpieza', fuera1) + linea('Quitó el repaso', fuera2) +
    linea('Volvieron por el mínimo de su área', vuelven) +
    '</div></details>' +

    '<details><summary>Con los que se ha quedado (' + quedan.length + ')</summary><div class="dentro">' +
    '<table><tr><th>Nº</th><th>Lista</th><th>Área</th><th>Conducta</th><th>Título</th><th>Descripción</th></tr>' +
    filasQ + '</table></div></details>';
}
</script>
</body>
</html>
